# .moai/project/harness-spec.yaml - machine-readable harness generation input
# Source: .moai/project/interview.md (extracted from 보담_기획설계_v0.2.md, not collected interactively).
# A null value means "not resolved", not "none".

domain: "healthcare-insurance-estimation"
goal: "A patient at a shared hospital kiosk, with no sign-up or login, selects the indemnity-insurance generation, the insurer and required conditions, and treatments, then sees the estimated total payment, estimated insurance payout, and estimated out-of-pocket amount after payout on a separate result screen. The estimate comes from a deterministic calculation engine over hospital treatment menus and verified policy rules, never from generative AI."
constraints:
  - "No generative AI in insurance calculation or coverage explanation; same input gives the same result and the same calculation basis"
  - "Supported generations fixed to Gen 1 (A/S), Gen 2 (C1), Gen 2.5 (C2), Gen 3 (C3), Gen 4 (C4); anything else returns UNSUPPORTED and is never calculated as C4"
  - "Gen 5, severe/non-severe branching, riders 1/2, and national-health-insurance copay-rate linkage are out of scope, including their data and tests"
  - "Unknown is not uncovered: an absent, unapproved, invalid, or under-review standard assumption profile or treatment coverage mapping puts calculation on hold, never 0 won or full coverage; unfixed standard values are never estimated; an unknown treatment cause only branches the required-documents list"
  - "Patient selections live only in the kiosk in-memory session; no localStorage, IndexedDB, or service-worker cache; no insurance or treatment conditions in URL queries or analytics; no personal health data stored on the server by default"
  - "Server never trusts client-submitted prices, rates, or clinic IDs and recalculates from published data with the same engine as the preview"
  - "Multi-hospital data and permission isolation; roles split into hospital administrator, insurance-rule reviewer, and platform operator"
  - "Operating rules require verified policy sources; unsourced rules stay DRAFT or DEMO and never apply to a real patient estimate"
  - "Touch-only kiosk; provisional layouts 1080x1920 portrait and 1920x1080 landscape; idle reset must never restore a previous patient's data"
scope: "In scope: kiosk start state, three input steps, separate result screen with calculation basis, idle-timeout reset, PC admin web, insurance-rule management with source tracking, server-side estimate API, same-day outpatient visit at a single domestic clinic with a general individual policy and one contract (multi-hospital-ready data model). Out of scope: patient sign-up or login, personal-information uploads, automatic insurance lookup, claims filing, inpatient, prescription/dispensing, multiple hospitals or dates in one estimate, multiple-policy proportional compensation, old-age/pre-existing-condition/group policies, workers' compensation or auto insurance combined, offline calculation, printer, phone connection, staff-call integration, result QR transfer, booking, reception, payment."
verification: "Meaningful tests for calculation, permissions, and public rules, reproducing the planning-document numeric examples and invariants; price-tampering, hospital-isolation, version-change, session-reset, and late-response cases; layout checks at 1080x1920 and 1920x1080. Concrete test command not chosen yet (stack unconfirmed)."
external_systems:
  - "Relational database (product undecided)"
  - "Administrator authentication provider (undecided)"
  - "Hospital treatment and price data entered by administrators"
  - "Insurer policy source documents verified by reviewers"
ui_surface: has-ui
team_sharing: null
