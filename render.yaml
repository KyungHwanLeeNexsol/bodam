# Dedicated synthetic-data demo. Never point the clinic's patient domain here.
services:
  - type: web
    name: bodam-kiosk-amount-demo
    runtime: node
    plan: free
    region: singapore
    branch: deploy/admin-kiosk-demo
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run demo:admin-kiosk:run
    healthCheckPath: /demo/health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: BODAM_DEMO_RENDER
        value: "1"
      - key: NEXT_PUBLIC_BODAM_DEMO_PRESENTATION
        value: "1"
      - key: BODAM_DEMO_ADMIN_TOKEN
        generateValue: true
