services:
  - type: web
    name: bodam-seongjeongwon-patient-kiosk
    runtime: static
    branch: deploy/seongjeongwon-patient-kiosk
    buildCommand: npm ci --include=dev && npm run build:patient-kiosk
    staticPublishPath: ./dist-ssr/patient-kiosk
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
