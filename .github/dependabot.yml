version: 2
updates:
  # The default branch is documentation-only. Add npm updates once
  # package.json and package-lock.json are merged into main.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:45"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
