version: 2
updates:
  # GitHub Actions versions (schedule unchanged from the original baseline).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:45"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3

  # Root application dependencies (package.json + package-lock.json).
  # Version-update PRs are opened for review only; nothing here merges them.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "11:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 3
